<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
       header {
           background-color: rgb(0, 60, 255);
           color: #FFFFFF;
           text-align: center;
           max-width: 800px;
           margin: 0 auto;
           padding: 16px;
           border: 5px solid;
       }
       main {
           background-color: #FFFFFF;
           color: rgb(218, 6, 122);
           max-width: 800px;
           margin: 0 auto;
           padding: 16px;
       }
       img {
           width: 80px;
           height: 80px;
       }
   </style>
</head>
<body>
   <header>
       <h1>Meu blog</h1>
   </header>
   <main>
       <h2>Primeiro post</h2>
       <p>por: Estefany Potmaier</p>
       <img src="11854.jpg" alt="Um logotipo de um controle de video game">
       <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de estudo e planejamento sobre a tecnologia.</p>
       <button>❤️<span>0</span></button>
       <button>👍<span>0</span></button>
   </main>

   <script>
      const botoes = document.querySelectorAll("button");

      botoes.forEach(function(botao) {
          botao.addEventListener("click", function() {
              console.log("fui clicado");
              let texto = botao.querySelector("span");
              texto.textContent = parseInt(texto.textContent) + 1;
          });
      }); 
   </script>
</body>
</html>
